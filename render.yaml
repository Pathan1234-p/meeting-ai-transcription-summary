services:
  - type: web
    name: meeting-ai-intelligence
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: streamlit run app/app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: SUMMARIZER_BACKEND
        value: local
      - key: SUMMARIZER_MODEL_NAME
        value: sshleifer/distilbart-cnn-12-6
      - key: NLI_MODEL_NAME
        value: cross-encoder/nli-deberta-v3-small
      - key: RANDOM_SEED
        value: 42
      - key: HF_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
